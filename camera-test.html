<!DOCTYPE html>
<html>
<head>
    <title>Camera Test</title>
    <style>
        body { margin: 0; padding: 20px; background: #000; color: #fff; font-family: sans-serif; }
        video { width: 640px; height: 480px; background: #333; border: 2px solid #fff; }
        button { padding: 10px 20px; margin: 10px; font-size: 16px; }
        #info { margin-top: 20px; padding: 10px; background: #222; }
    </style>
</head>
<body>
    <h1>Camera Test</h1>
    <button onclick="startCamera()">Start Camera</button>
    <button onclick="stopCamera()">Stop Camera</button>
    <br>
    <video id="video" autoplay playsinline muted></video>
    <div id="info">Status: Ready</div>

    <script>
        const video = document.getElementById('video');
        const info = document.getElementById('info');
        let stream = null;

        async function startCamera() {
            try {
                info.textContent = 'Status: Requesting camera...';
                
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: 1280, height: 720 }
                });
                
                info.textContent = 'Status: Camera granted, attaching to video...';
                console.log('Stream tracks:', stream.getTracks());
                
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    info.textContent = `Status: Metadata loaded (${video.videoWidth}x${video.videoHeight})`;
                    console.log('Video dimensions:', video.videoWidth, video.videoHeight);
                };
                
                video.oncanplay = () => {
                    info.textContent = 'Status: Can play';
                    console.log('Can play');
                };
                
                video.onplay = () => {
                    info.textContent = 'Status: PLAYING ✓';
                    console.log('Playing!');
                };
                
                await video.play();
                
            } catch (err) {
                info.textContent = 'Status: ERROR - ' + err.message;
                console.error('Error:', err);
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
                stream = null;
                info.textContent = 'Status: Camera stopped';
            }
        }
    </script>
</body>
</html>
